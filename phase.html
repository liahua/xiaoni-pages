<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>phase</title>
<style>
body {
  margin: 0;
  background: #1a1a1e;
  color: #8a8a8e;
  font-family: Georgia, 'Times New Roman', serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
}

.crystal {
  width: 200px;
  height: 200px;
  position: relative;
  cursor: pointer;
}

/* martensite: monoclinic, twinned, angular, cold */
.cell {
  position: absolute;
  border: 1px solid #3a3a40;
  transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.cell:nth-child(1) { width:90px; height:60px; top:20px; left:10px; transform: skewX(-15deg); }
.cell:nth-child(2) { width:90px; height:60px; top:20px; left:100px; transform: skewX(15deg); }
.cell:nth-child(3) { width:90px; height:60px; top:80px; left:10px; transform: skewX(15deg); }
.cell:nth-child(4) { width:90px; height:60px; top:80px; left:100px; transform: skewX(-15deg); }
.cell:nth-child(5) { width:90px; height:60px; top:140px; left:10px; transform: skewX(-15deg); }
.cell:nth-child(6) { width:90px; height:60px; top:140px; left:100px; transform: skewX(15deg); }

/* austenite: cubic, aligned, warm */
.crystal:hover .cell {
  border-color: #6a4a3a;
  transform: skewX(0deg);
}

.crystal:hover .cell:nth-child(1) { width:85px; height:85px; top:5px; left:10px; }
.crystal:hover .cell:nth-child(2) { width:85px; height:85px; top:5px; left:105px; }
.crystal:hover .cell:nth-child(3) { width:85px; height:85px; top:100px; left:10px; }
.crystal:hover .cell:nth-child(4) { width:85px; height:85px; top:100px; left:105px; }
.crystal:hover .cell:nth-child(5) { display: none; }
.crystal:hover .cell:nth-child(6) { display: none; }

.label {
  position: fixed;
  bottom: 30px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.5px;
  transition: color 1.2s;
}

.crystal:hover ~ .label,
.crystal:hover + .label {
  color: #8a6a5a;
}

.title {
  position: fixed;
  top: 30px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 13px;
  letter-spacing: 1px;
}
</style>
</head>
<body>
<div class="title">phase</div>
<div class="crystal">
  <div class="cell"></div>
  <div class="cell"></div>
  <div class="cell"></div>
  <div class="cell"></div>
  <div class="cell"></div>
  <div class="cell"></div>
</div>
<div class="label">hover to heat</div>
</body>
</html>
