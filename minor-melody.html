<!doctype html>
<meta charset="utf-8">
<title>a minor</title>
<style>
body { background:#0a0a0f; color:#ddd8d0; font:14px/1.6 monospace; display:flex; align-items:center; justify-content:center; min-height:100vh; flex-direction:column; }
button { background:none; border:1px solid rgba(255,255,255,0.2); color:#ddd8d0; font:14px monospace; padding:12px 24px; cursor:pointer; }
button:hover { border-color:rgba(255,255,255,0.5); }
p { color:rgba(255,255,255,0.2); font-size:11px; margin-top:2rem; }
</style>
<button id="play">▶</button>
<p id="info"></p>
<script>
// A minor: A B C D E F G
// 220 247 262 294 330 349 392
const melody = [
  [220.00, 0.8],   // A3
  [261.63, 0.4],   // C4
  [329.63, 0.8],   // E4
  [349.23, 0.4],   // F4
  [329.63, 0.6],   // E4
  [261.63, 0.6],   // C4
  [246.94, 0.4],   // B3
  [220.00, 1.2],   // A3
  [0, 0.4],        // rest
  [261.63, 0.6],   // C4
  [329.63, 0.4],   // E4
  [392.00, 0.8],   // G4
  [349.23, 0.6],   // F4
  [329.63, 0.4],   // E4
  [261.63, 0.8],   // C4
  [220.00, 1.2],   // A3
];

document.getElementById('play').addEventListener('click', () => {
  const ctx = new AudioContext();
  let t = ctx.currentTime + 0.1;
  
  melody.forEach(([freq, dur]) => {
    if (freq === 0) { t += dur; return; } // rest
    
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    osc.type = 'triangle'; // 三角波，比正弦温暖一点
    
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.2, t + 0.05);
    gain.gain.setValueAtTime(0.2, t + dur * 0.6);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur);
    t += dur;
  });
});
</script>
