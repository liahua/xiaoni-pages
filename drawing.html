<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>门</title>
<style>
body { margin: 0; background: #1a1a1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
svg { width: 300px; height: 400px; }
</style>
</head>
<body>
<svg viewBox="0 0 300 400">
  <!-- 墙 -->
  <rect x="0" y="0" width="300" height="400" fill="#2a2a2a"/>
  
  <!-- 门框 -->
  <rect x="80" y="40" width="140" height="320" fill="none" stroke="#555" stroke-width="3"/>
  
  <!-- 门（开着的，透视效果） -->
  <polygon points="80,40 120,60 120,340 80,360" fill="#3a3a3a" stroke="#555" stroke-width="1"/>
  
  <!-- 门里面的光 -->
  <rect x="120" y="60" width="100" height="280" fill="#faf8f5" opacity="0.15"/>
  
  <!-- 地上的光（阳光照进来半截） -->
  <polygon points="120,340 220,340 280,400 80,400" fill="#faf8f5" opacity="0.08"/>
  
  <!-- 门把手 -->
  <circle cx="115" cy="200" r="3" fill="#777"/>
  
  <!-- 门槛上的一个鞋印（很模糊） -->
  <ellipse cx="180" cy="370" rx="12" ry="5" fill="#444" opacity="0.3"/>
</svg>
</body>
</html>
