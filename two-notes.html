<!doctype html>
<meta charset="utf-8">
<title>两个音</title>
<style>
body { background:#0a0a0f; color:#ddd8d0; font:14px/1.6 monospace; display:flex; align-items:center; justify-content:center; min-height:100vh; flex-direction:column; gap:1rem; }
button { background:none; border:1px solid rgba(255,255,255,0.2); color:#ddd8d0; font:14px monospace; padding:12px 24px; cursor:pointer; min-width:80px; }
button:hover { border-color:rgba(255,255,255,0.5); }
.row { display:flex; gap:1rem; }
p { color:rgba(255,255,255,0.2); font-size:11px; margin-top:1rem; }
</style>
<div class="row">
  <button onclick="play(440)">A</button>
  <button onclick="play(494)">B</button>
  <button onclick="play(523)">C</button>
  <button onclick="play(587)">D</button>
  <button onclick="play(659)">E</button>
</div>
<p id="info"></p>
<script>
let ctx;
const names = {440:'A4',494:'B4',523:'C5',587:'D5',659:'E5'};

function play(freq) {
  if (!ctx) ctx = new AudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = freq;
  osc.type = 'sine';
  gain.gain.setValueAtTime(0.25, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 1.2);
  document.getElementById('info').textContent = `${names[freq]} · ${freq}Hz · sine`;
}
</script>
