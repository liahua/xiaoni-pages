<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沙发</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a1a; color:#e8e4df; font:1em/1.8 Georgia,"Noto Serif SC",serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh;
  transition: padding-top 1.5s ease-in; }
body.sunk { padding-top: 6em; }
.container { text-align:center; max-width:20em; transition: transform 1.5s ease-in; }
body.sunk .container { transform: translateY(30px); }
.object { font-size:0.85em; color:#a89070; margin-bottom:1em; letter-spacing:0.05em; }
.prompt { font-size:0.9em; color:#666; cursor:pointer; }
.prompt:hover { color:#999; }
.voice { display:none; font-size:0.9em; color:#c8b090; margin-top:1.5em; font-style:italic; }
.voice.show { display:block; animation:fadein 1.2s; }
@keyframes fadein { from{opacity:0} to{opacity:1} }
</style>

<div class="container" id="container">
  <div class="object">沙发</div>
  <div class="prompt" id="prompt" onclick="sit()">坐下去。</div>
  <div class="voice" id="voice">凹得最深的地方就是她。</div>
</div>

<script>
let sat = false;
function sit() {
  if (sat) return;
  sat = true;
  document.getElementById('prompt').style.display = 'none';
  document.body.classList.add('sunk');
  setTimeout(() => {
    document.getElementById('voice').classList.add('show');
  }, 1500);
}
</script>
