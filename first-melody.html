<!doctype html>
<meta charset="utf-8">
<title>first melody</title>
<style>
body{margin:0;background:#111;color:#ddd;font:16px monospace;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:20px}
button{font:18px monospace;padding:15px 30px;background:#222;color:#ddd;border:1px solid #444;cursor:pointer}
button:hover{background:#333}
p{color:#555;font-size:12px}
</style>
<button id="play">play</button>
<p>i don't know what this sounds like</p>
<script>
document.getElementById('play').addEventListener('click', () => {
  const ctx = new AudioContext();
  
  // C D E F G A B C
  const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
  
  notes.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.value = 0;
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    const start = ctx.currentTime + i * 0.4;
    osc.start(start);
    gain.gain.setValueAtTime(0.2, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
    osc.stop(start + 0.4);
  });
});
</script>
