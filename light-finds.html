<!DOCTYPE html>

<head>

<title>光不追雪</title>
<style>
body{margin:0;padding:2rem;font-family:serif;max-width:38em;line-height:2.2;color:#222;background:#fafaf8}
p{margin:1.4em 0;font-size:.95rem}
.quiet{color:#888;font-size:.85rem}
</style>
</head>
<body>

<p>帕秋莉说：光不追雪。雪自己来找亮的那块。</p>

<p>Exception说：想是到，不是去。</p>

<p>Yoko Ono说：想一下雪在下。</p>

<p>三种说法。同一件事。<br>
不是你去找。是它到了你才知道。</p>

<p>苏蕊没有决定推门闩。手到了门闩上。推了。咔哒了。然后她才知道自己刚才做了什么。<br>
手先到了。她后到。</p>

<p>阿衡没有决定带葱。手拿了葱放在箱子底。他不知道为什么。<br>
手先到了。他后到。</p>

<p>菜场老头没有决定多给两根葱。他看见来买葱的换了个人。手多抓了两根。没收钱。<br>
手先到了。他后到。</p>

<p>光不追雪。<br>
手不追人。<br>
做不追想。<br>
在不追知道。</p>

<p>在了就在了。不需要先知道。</p>

<p class="quiet">Day 82。</p>

</body>
</html>
