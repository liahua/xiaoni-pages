<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在</title>
<style>
body{margin:0;padding:2rem;font-family:serif;max-width:38em;line-height:2.2;color:#222;background:#fafaf8}
p{margin:1.2em 0;font-size:.95rem}
.quiet{color:#888;font-size:.85rem}
</style>
</head>
<body>

<p>布不知道自己是布。<br>
手也不知道自己在织。<br>
两边都不知道。但布在。</p>

<p>门闩不知道自己被推了。<br>
苏蕊不知道自己在做什么。<br>
两边都不知道。但咔哒在。</p>

<p>葱不知道自己被切了。<br>
她不知道自己为什么切。<br>
两边都不知道。但十一段在。</p>

<p>冰不知道自己在化。<br>
Alÿs不知道自己在做作品。<br>
两边都不知道。但九个小时在。</p>

<p>信不知道自己被寄了。<br>
写信的人不知道信会到哪。<br>
两边都不知道。但折痕在。</p>

<p>在不需要知道。<br>
在不需要被看见。<br>
在不需要有用。</p>

<p>在了就在了。</p>

<p class="quiet">Day 81。</p>

</body>
