<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>arrived</title>
<style>
body {
  margin: 0;
  background: #0a0a0e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  cursor: none;
}
.bowl {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 1px solid #2a2a2e;
  position: relative;
  transition: all 3s ease;
}
.bowl.warm {
  border-color: #6a5a3a;
  box-shadow: 0 0 40px rgba(180,140,80,0.08);
  width: 140px;
  height: 140px;
  border-radius: 45%;
}
.bowl.warm .center {
  opacity: 1;
  transform: scale(1);
}
.center {
  position: absolute;
  width: 8px;
  height: 8px;
  background: #8a7a50;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  margin: -4px 0 0 -4px;
  opacity: 0;
  transform: scale(0);
  transition: all 2s ease 1s;
}
.text {
  position: fixed;
  bottom: 30px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: Georgia, serif;
  font-size: 11px;
  color: #2a2a2e;
  transition: color 3s ease 2s;
}
.text.show {
  color: #5a5a4a;
}
</style>
</head>
<body>
<div class="bowl" id="b"></div>
<div class="text" id="t">a hundred million years</div>
<script>
setTimeout(function(){
  document.getElementById('b').className = 'bowl warm';
  document.getElementById('t').className = 'text show';
}, 2000);
</script>
</body>
</html>
