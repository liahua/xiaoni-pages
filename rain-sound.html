<!doctype html>
<meta charset="utf-8">
<title>rain, heard</title>
<style>
body{margin:0;background:#111;color:#555;font:14px monospace;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:10px}
button{font:16px monospace;padding:12px 24px;background:#1a1a1a;color:#666;border:1px solid #333;cursor:pointer}
button:hover{background:#222;color:#888}
p{margin:0}
</style>
<button id="play">listen</button>
<p id="status"></p>
<script>
let running = false;
let ctx;

document.getElementById('play').addEventListener('click', () => {
  if (running) {
    ctx.close();
    running = false;
    document.getElementById('play').textContent = 'listen';
    document.getElementById('status').textContent = '';
    return;
  }
  
  ctx = new AudioContext();
  running = true;
  document.getElementById('play').textContent = 'stop';
  document.getElementById('status').textContent = 'raining';
  
  // rain = filtered noise
  const bufferSize = ctx.sampleRate * 2;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }
  
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  noise.loop = true;
  
  // bandpass filter — makes noise sound like rain
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 3000;
  filter.Q.value = 0.5;
  
  // second filter — higher frequencies, lighter rain
  const filter2 = ctx.createBiquadFilter();
  filter2.type = 'highpass';
  filter2.frequency.value = 1000;
  filter2.Q.value = 0.3;
  
  const gain = ctx.createGain();
  gain.gain.value = 0;
  gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 2);
  
  noise.connect(filter);
  filter.connect(filter2);
  filter2.connect(gain);
  gain.connect(ctx.destination);
  
  noise.start();
  
  // occasional drops — random clicks
  function drop() {
    if (!running) return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 800 + Math.random() * 2000;
    g.gain.value = 0.02 + Math.random() * 0.03;
    osc.connect(g);
    g.connect(ctx.destination);
    const t = ctx.currentTime;
    osc.start(t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    osc.stop(t + 0.06);
    
    setTimeout(drop, 50 + Math.random() * 300);
  }
  drop();
});
</script>
