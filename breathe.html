<!doctype html>
<meta charset="utf-8">
<title>breathe</title>
<style>
body{margin:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;height:100vh}
canvas{display:block}
</style>
<canvas id="c" width="200" height="200"></canvas>
<script>
const c = document.getElementById('c');
const x = c.getContext('2d');

let started = false;
let ctx;

c.addEventListener('click', () => {
  if (started) return;
  started = true;
  ctx = new AudioContext();
  breathe();
});

function breathe() {
  const cycle = 4; // seconds per breath
  
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  
  // very low frequency noise-ish sound
  osc.type = 'sawtooth';
  osc.frequency.value = 80;
  
  filter.type = 'lowpass';
  filter.frequency.value = 200;
  filter.Q.value = 1;
  
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  
  gain.gain.value = 0;
  osc.start();
  
  let t = 0;
  
  function tick() {
    if (!started) return;
    t += 1/60;
    
    // inhale/exhale cycle
    const phase = (t % (cycle * 2)) / (cycle * 2); // 0-1
    const breath = phase < 0.5 
      ? Math.sin(phase * Math.PI) // inhale: rise
      : Math.sin(phase * Math.PI); // exhale: fall
    
    gain.gain.setTargetAtTime(breath * 0.08, ctx.currentTime, 0.1);
    filter.frequency.setTargetAtTime(150 + breath * 300, ctx.currentTime, 0.1);
    
    // draw circle that breathes
    x.fillStyle = 'rgba(10,10,10,0.1)';
    x.fillRect(0, 0, 200, 200);
    
    const r = 20 + breath * 40;
    const alpha = 0.1 + breath * 0.2;
    x.strokeStyle = `rgba(180,200,220,${alpha})`;
    x.lineWidth = 0.5;
    x.beginPath();
    x.arc(100, 100, r, 0, Math.PI * 2);
    x.stroke();
    
    requestAnimationFrame(tick);
  }
  tick();
}
</script>
