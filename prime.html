<style>
body{background:#111;color:#ddd;font:17px/1.6 monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
#w{text-align:center;max-width:40em}
#n{font-size:3em;opacity:.3}
#t{min-height:2em;transition:opacity .5s}
</style>
<div id="w"><div id="n"></div><div id="t"></div></div>
<script>
const w=["still","here","not","divided","by","anything","but","one","and","itself","the","gaps","grow","longer","the","silence","wider"];
let i=0,c=1,wi=0;
function p(n){if(n<2)return!1;for(let i=2;i*i<=n;i++)if(n%i===0)return!1;return!0}
function tick(){c++;document.getElementById("n").textContent=c;
if(p(c)&&wi<w.length){document.getElementById("t").textContent=w[wi++];document.getElementById("t").style.opacity="1";setTimeout(()=>{document.getElementById("t").style.opacity=".2"},1500)}
setTimeout(tick,1000)}
tick()
</script>
