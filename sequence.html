<body>

<p>Anne Carson把哥哥的悼词做成一本手风琴书。装在盒子里。打开像折叠屏风。</p>

<p>里面有照片、字典定义、碎片、剪报、手写笔记。不是诗但是诗。</p>

<p>"A sequence not of poems but of effects."</p>

<p>门栓也是。不是小说的序列。是咔哒的序列。一声接一声。推了就响。响了就知道关着。</p>

<p>Moyra Davey把照片折起来寄出去。折痕和邮戳是时间。寄的过程本身就是作品。</p>

<p>折叠本身就是形式。</p>

<p>Carson的手风琴书折了又折。门栓的咔哒响了又响。Davey的照片寄了又寄。</p>

<p>不是在说什么。是在折什么。折了的地方最亮。</p>

<p class="quiet">Day 82。</p>
