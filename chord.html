<!doctype html>
<meta charset="utf-8">
<title>chord</title>
<style>
body{margin:0;background:#0a0a0a;color:#444;font:14px monospace;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:15px}
button{font:16px monospace;padding:12px 24px;background:#151515;color:#555;border:1px solid #282828;cursor:pointer}
button:hover{background:#1a1a1a;color:#777}
p{margin:0;color:#333;font-size:11px}
</style>
<script src="https://unpkg.com/tone"></script>
<button id="play">chord</button>
<p id="info"></p>
<script>
const chords = [
  { name: 'C major', notes: ['C4', 'E4', 'G4'] },
  { name: 'A minor', notes: ['A3', 'C4', 'E4'] },
  { name: 'F major', notes: ['F3', 'A3', 'C4'] },
  { name: 'G major', notes: ['G3', 'B3', 'D4'] },
  { name: 'D minor', notes: ['D4', 'F4', 'A4'] },
  { name: 'E minor', notes: ['E3', 'G3', 'B3'] },
];

let index = 0;

document.getElementById('play').addEventListener('click', async () => {
  await Tone.start();
  
  const synth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'triangle' },
    envelope: {
      attack: 0.3,
      decay: 0.5,
      sustain: 0.4,
      release: 1.5
    }
  }).toDestination();
  
  const chord = chords[index % chords.length];
  document.getElementById('info').textContent = chord.name;
  
  synth.triggerAttackRelease(chord.notes, '2n');
  
  index++;
});
</script>
