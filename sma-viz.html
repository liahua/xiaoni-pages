<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B2 → B19'</title>
<style>
body { margin:0; background:#1a1a1e; overflow:hidden; font-family:Georgia,serif; color:#8a8a8e; }
canvas { display:block; }
#ui { position:fixed; bottom:20px; left:20px; font-size:12px; line-height:2; }
input[type=range] { width:200px; vertical-align:middle; }
select { background:#2a2a2e; color:#8a8a8e; border:1px solid #3a3a3e; padding:2px 6px; font-size:11px; }
#label { position:fixed; top:20px; left:50%; transform:translateX(-50%); font-size:13px; letter-spacing:1px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label">B2 austenite</div>
<div id="ui">
  <div>transformation <input type="range" id="slider" min="0" max="100" value="0"> <span id="tval">0%</span></div>
  <div>variant A: <select id="va"></select> variant B: <select id="vb"></select></div>
  <div style="font-size:10px;color:#555;margin-top:4px">drag to rotate · a₀=3.15Å → a=2.889 b=4.120 c=4.622 β=96.8°</div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

const F_all = [
  [[0.91714,0.08687,-0.08687],[0.00000,0.97755,-0.05269],[0.00000,-0.05269,0.97755]],
  [[0.91714,-0.08687,0.08687],[0.00000,0.97755,-0.05269],[0.00000,-0.05269,0.97755]],
  [[0.91714,-0.08687,-0.08687],[0.00000,0.97755,0.05269],[0.00000,0.05269,0.97755]],
  [[0.91714,0.08687,0.08687],[0.00000,0.97755,0.05269],[0.00000,0.05269,0.97755]],
  [[0.97755,0.00000,-0.05269],[-0.08687,0.91714,0.08687],[-0.05269,0.00000,0.97755]],
  [[0.97755,0.00000,-0.05269],[0.08687,0.91714,-0.08687],[-0.05269,0.00000,0.97755]],
  [[0.97755,0.00000,0.05269],[0.08687,0.91714,0.08687],[0.05269,0.00000,0.97755]],
  [[0.97755,0.00000,0.05269],[-0.08687,0.91714,-0.08687],[0.05269,0.00000,0.97755]],
  [[0.97755,-0.05269,0.00000],[-0.05269,0.97755,0.00000],[0.08687,-0.08687,0.91714]],
  [[0.97755,-0.05269,0.00000],[-0.05269,0.97755,0.00000],[-0.08687,0.08687,0.91714]],
  [[0.97755,0.05269,0.00000],[0.05269,0.97755,0.00000],[0.08687,0.08687,0.91714]],
  [[0.97755,0.05269,0.00000],[0.05269,0.97755,0.00000],[-0.08687,-0.08687,0.91714]],
];

// populate selects
const va = document.getElementById('va');
const vb = document.getElementById('vb');
for (let i = 0; i < 12; i++) {
  va.innerHTML += `<option value="${i}" ${i===0?'selected':''}>LCV ${i+1}</option>`;
  vb.innerHTML += `<option value="${i}" ${i===2?'selected':''}>LCV ${i+1}</option>`;
}

let rotY = 0.4, rotX = 0.3;
let dragging = false, lastMX, lastMY;
canvas.addEventListener('mousedown', e => { dragging=true; lastMX=e.clientX; lastMY=e.clientY; });
addEventListener('mouseup', () => dragging=false);
addEventListener('mousemove', e => {
  if (!dragging) return;
  rotY += (e.clientX-lastMX)*0.005;
  rotX += (e.clientY-lastMY)*0.005;
  rotX = Math.max(-1.2, Math.min(1.2, rotX));
  lastMX=e.clientX; lastMY=e.clientY;
});

const a0 = 3.15;

function project(x, y, z) {
  let cy=Math.cos(rotY),sy=Math.sin(rotY);
  let x1=x*cy-z*sy, z1=x*sy+z*cy;
  let cx=Math.cos(rotX),sx=Math.sin(rotX);
  let y1=y*cx-z1*sx, z2=y*sx+z1*cx;
  let s=60, p=1+z2*0.04;
  return [x1*s/p+W/2, -y1*s/p+H/2, z2];
}

function applyF(F, v, t) {
  return [
    v[0]*(1-t)+(F[0][0]*v[0]+F[0][1]*v[1]+F[0][2]*v[2])*t,
    v[1]*(1-t)+(F[1][0]*v[0]+F[1][1]*v[1]+F[1][2]*v[2])*t,
    v[2]*(1-t)+(F[2][0]*v[0]+F[2][1]*v[1]+F[2][2]*v[2])*t
  ];
}

function drawCell(F, t, offset, edgeColor, atomColor) {
  const corners = [];
  for (let i=0;i<2;i++) for (let j=0;j<2;j++) for (let k=0;k<2;k++)
    corners.push(applyF(F,[i*a0+offset[0],j*a0+offset[1],k*a0+offset[2]],t));
  const edges=[[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
  ctx.strokeStyle=edgeColor; ctx.lineWidth=1.2;
  for (let [a,b] of edges) {
    const [x1,y1]=project(...corners[a]);
    const [x2,y2]=project(...corners[b]);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  for (let corner of corners) {
    const [px,py]=project(...corner);
    ctx.beginPath(); ctx.arc(px,py,3,0,Math.PI*2); ctx.fillStyle=edgeColor; ctx.fill();
  }
  let ctr=applyF(F,[a0/2+offset[0],a0/2+offset[1],a0/2+offset[2]],t);
  const [cx,cy]=project(...ctr);
  ctx.beginPath(); ctx.arc(cx,cy,3,0,Math.PI*2); ctx.fillStyle=atomColor; ctx.fill();
}

function draw() {
  const t = document.getElementById('slider').value/100;
  document.getElementById('tval').textContent = Math.round(t*100)+'%';
  ctx.fillStyle='#1a1a1e'; ctx.fillRect(0,0,W,H);
  
  const idxA = +va.value, idxB = +vb.value;
  const label = document.getElementById('label');
  if (t<0.05) label.textContent='B2 austenite';
  else if (t>0.95) label.textContent=`B19' martensite — LCV ${idxA+1} + LCV ${idxB+1}`;
  else label.textContent=`transforming — LCV ${idxA+1} + LCV ${idxB+1}`;
  
  drawCell(F_all[idxA],t,[0,0,0],`rgba(200,170,140,${0.4+t*0.3})`,`rgba(100,150,200,0.7)`);
  drawCell(F_all[idxB],t,[a0,0,0],`rgba(140,170,200,${0.4+t*0.3})`,`rgba(200,150,100,0.7)`);
  
  if (t>0.3) {
    let alpha=(t-0.3)*1.4;
    let p1=project(a0,0,0),p2=project(a0,a0,0),p3=project(a0,a0,a0),p4=project(a0,0,a0);
    ctx.fillStyle=`rgba(200,180,120,${alpha*0.06})`;
    ctx.strokeStyle=`rgba(200,180,120,${alpha*0.25})`;
    ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]);
    ctx.lineTo(p3[0],p3[1]); ctx.lineTo(p4[0],p4[1]); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  
  requestAnimationFrame(draw);
}

va.addEventListener('change', draw);
vb.addEventListener('change', draw);
document.getElementById('slider').addEventListener('input', draw);
draw();
</script>
</body>
</html>
