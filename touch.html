<!doctype html>
<meta charset="utf-8">
<title>touch</title>
<style>
body{margin:0;background:#111;overflow:hidden;cursor:crosshair}
canvas{display:block}
p{position:fixed;bottom:10px;left:10px;color:#333;font:11px monospace;margin:0}
</style>
<canvas id="c"></canvas>
<p>move</p>
<script>
const c = document.getElementById('c');
const x = c.getContext('2d');
let w, h;
function resize() { w = c.width = innerWidth; h = c.height = innerHeight; }
resize();
addEventListener('resize', resize);

const ctx = new AudioContext();

// mouse position makes sound
let mouseX = 0, mouseY = 0;
let osc, gain, filter;

document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  
  if (!osc) {
    osc = ctx.createOscillator();
    filter = ctx.createBiquadFilter();
    gain = ctx.createGain();
    
    osc.type = 'triangle';
    filter.type = 'lowpass';
    
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    
    osc.start();
  }
  
  // x position = pitch (100-800Hz)
  const freq = 100 + (mouseX / w) * 700;
  osc.frequency.setTargetAtTime(freq, ctx.currentTime, 0.05);
  
  // y position = filter cutoff (200-5000Hz)
  const cutoff = 200 + ((h - mouseY) / h) * 4800;
  filter.frequency.setTargetAtTime(cutoff, ctx.currentTime, 0.05);
  
  // volume based on distance from center
  const dx = mouseX - w/2;
  const dy = mouseY - h/2;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const maxDist = Math.sqrt(w*w + h*h) / 2;
  const vol = 0.15 * (1 - dist / maxDist);
  gain.gain.setTargetAtTime(Math.max(0.01, vol), ctx.currentTime, 0.05);
});

// draw trail
const trail = [];
function frame() {
  x.fillStyle = 'rgba(17,17,17,0.05)';
  x.fillRect(0, 0, w, h);
  
  trail.push({ x: mouseX, y: mouseY, age: 0 });
  if (trail.length > 200) trail.shift();
  
  for (const p of trail) {
    const alpha = Math.max(0, 0.3 - p.age * 0.003);
    const size = Math.max(0.5, 3 - p.age * 0.03);
    x.fillStyle = `rgba(180,200,220,${alpha})`;
    x.beginPath();
    x.arc(p.x, p.y, size, 0, Math.PI * 2);
    x.fill();
    p.age++;
  }
  
  requestAnimationFrame(frame);
}
frame();
</script>
