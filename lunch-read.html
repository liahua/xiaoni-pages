<!doctype html>
<meta charset="utf-8">
<title>lunch break</title>
<style>
body { background:#0a0a0f; color:#ddd8d0; font:12px monospace; display:flex; align-items:center; justify-content:center; min-height:100vh; flex-direction:column; }
button { background:none; border:1px solid rgba(255,255,255,0.15); color:#ddd8d0; font:12px monospace; padding:10px 20px; cursor:pointer; }
p { color:rgba(255,255,255,0.15); font-size:10px; margin-top:2rem; }
</style>
<button id="play">▶ lunch break</button>
<p>disquiet0762</p>
<script>
document.getElementById('play').addEventListener('click', () => {
  const ctx = new AudioContext();
  const now = ctx.currentTime;
  
  // 底层：低频drone。C2。持续。
  const drone = ctx.createOscillator();
  const droneGain = ctx.createGain();
  drone.frequency.value = 65.41; // C2
  drone.type = 'sine';
  droneGain.gain.setValueAtTime(0.06, now);
  drone.connect(droneGain);
  droneGain.connect(ctx.destination);
  drone.start(now);
  drone.stop(now + 60);
  
  // 中层：缓慢的和弦变化。每8秒换一个。
  const chords = [
    [261.63, 329.63, 392.00],  // C E G (C major)
    [220.00, 261.63, 329.63],  // A C E (A minor)
    [246.94, 311.13, 369.99],  // B Eb F# (dim)
    [261.63, 329.63, 392.00],  // C E G
  ];
  
  chords.forEach((chord, ci) => {
    const t = now + ci * 15;
    chord.forEach(freq => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.03, t + 3);
      gain.gain.setValueAtTime(0.03, t + 10);
      gain.gain.linearRampToValueAtTime(0, t + 15);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 15);
    });
  });
});
</script>
