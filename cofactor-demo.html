<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>λ₂</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0a0a0f;
  color: #ddd8d0;
  font: 14px/1.6 monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
canvas { display: block; margin: 2rem 0; }
.controls { text-align: center; }
input[type=range] { width: 300px; }
.val { font-size: 1.2em; margin: 0.5rem 0; }
.label { color: rgba(255,255,255,0.3); font-size: 12px; margin-top: 1rem; }
</style>
<div class="controls">
  <div class="val">λ₂ = <span id="v">1.000</span></div>
  <input type="range" id="slider" min="0.900" max="1.100" step="0.001" value="1.000">
</div>
<canvas id="c" width="600" height="300"></canvas>
<div class="label">drag the slider · watch the gap</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const slider = document.getElementById('slider');
const vSpan = document.getElementById('v');

function draw() {
  const w = c.width, h = c.height;
  const lambda2 = parseFloat(slider.value);
  vSpan.textContent = lambda2.toFixed(3);
  
  ctx.clearRect(0, 0, w, h);
  
  const cx = w / 2;
  const cy = h / 2;
  const size = 80;
  
  // Left crystal (austenite) - unchanged
  ctx.strokeStyle = 'rgba(100,180,255,0.6)';
  ctx.lineWidth = 2;
  const x1 = cx - size - 10;
  ctx.strokeRect(x1 - size, cy - size, size * 2, size * 2);
  
  // grid lines for left crystal
  ctx.strokeStyle = 'rgba(100,180,255,0.2)';
  ctx.lineWidth = 1;
  for (let i = -size; i <= size; i += 20) {
    ctx.beginPath();
    ctx.moveTo(x1 + i, cy - size);
    ctx.lineTo(x1 + i, cy + size);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x1 - size, cy + i);
    ctx.lineTo(x1 + size, cy + i);
    ctx.stroke();
  }
  
  // Right crystal (martensite) - stretched by lambda2
  const x2 = cx + size + 10;
  const sy = size * lambda2; // vertical stretch
  const sx = size / lambda2; // horizontal compress (volume preserving)
  
  ctx.strokeStyle = 'rgba(255,160,100,0.6)';
  ctx.lineWidth = 2;
  ctx.strokeRect(x2 - sx, cy - sy, sx * 2, sy * 2);
  
  // grid lines for right crystal
  ctx.strokeStyle = 'rgba(255,160,100,0.2)';
  ctx.lineWidth = 1;
  const stepY = 20 * lambda2;
  const stepX = 20 / lambda2;
  for (let i = -sx; i <= sx; i += stepX) {
    ctx.beginPath();
    ctx.moveTo(x2 + i, cy - sy);
    ctx.lineTo(x2 + i, cy + sy);
    ctx.stroke();
  }
  for (let i = -sy; i <= sy; i += stepY) {
    ctx.beginPath();
    ctx.moveTo(x2 - sx, cy + i);
    ctx.lineTo(x2 + sx, cy + i);
    ctx.stroke();
  }
  
  // Gap indicator
  const gap = Math.abs(lambda2 - 1.0);
  const gapColor = gap < 0.005 ? 'rgba(100,255,100,0.8)' : `rgba(255,${Math.max(0, 255 - gap * 2000)},${Math.max(0, 100 - gap * 1000)},0.6)`;
  
  // Interface line
  ctx.strokeStyle = gapColor;
  ctx.lineWidth = 3;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(cx, cy - Math.max(size, sy) - 20);
  ctx.lineTo(cx, cy + Math.max(size, sy) + 20);
  ctx.stroke();
  ctx.setLineDash([]);
  
  // Status
  ctx.fillStyle = gapColor;
  ctx.font = '13px monospace';
  ctx.textAlign = 'center';
  if (gap < 0.005) {
    ctx.fillText('compatible', cx, cy + Math.max(size, sy) + 45);
  } else {
    ctx.fillText(`gap: ${(gap * 100).toFixed(1)}%`, cx, cy + Math.max(size, sy) + 45);
  }
  
  // Labels
  ctx.fillStyle = 'rgba(100,180,255,0.4)';
  ctx.fillText('austenite', x1, cy + size + 25);
  ctx.fillStyle = 'rgba(255,160,100,0.4)';
  ctx.fillText('martensite', x2, cy + sy + 25);
}

slider.addEventListener('input', draw);
draw();
</script>
