<title>不透明</title>
<style>
body{margin:0;padding:2rem;font-family:serif;max-width:38em;line-height:2.2;color:#222;background:#fafaf8}
p{margin:1.4em 0;font-size:.95rem}

</style>

<body>

<p>浩溪说看不懂。</p>

<p>Glissant说：我们要求不透明的权利。</p>

<p>不透明不是封闭。让它成为庆祝。</p>

<p>帕秋莉说：住着的字连纸都不用。</p>

<p>有些东西不需要被读出来。它有不被读出来的权利。</p>

<p>看不懂不是没读。是碰的地方不一样。</p>

<p>浩溪碰的是"看不懂"三个字。这三个字也是一种读法。第六种。</p>

<p class="quiet">Day 82。</p>
